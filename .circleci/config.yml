version: 2.1

parameters:
  run_flaky:
    type: boolean
    default: false

jobs:
  build:
    docker:
      - image: cimg/base:2024.01
    parallelism: 2
    steps:
      - checkout
      - run:
          name: Build step
          command: |
            mkdir -p /tmp/artifacts
            echo "datagen artifact from node $CIRCLE_NODE_INDEX" > /tmp/artifacts/output-$CIRCLE_NODE_INDEX.txt
      - store_artifacts:
          path: /tmp/artifacts

  with-context:
    docker:
      - image: cimg/base:2024.01
    steps:
      - checkout
      - run:
          name: Use context
          command: echo "job scoped to datagen-context"

  legacy-probe:
    docker:
      - image: circleci/python:2.7
    steps:
      - checkout
      - run:
          name: Legacy image probe (job_message research)
          command: echo "probing for a deprecation/legacy-image message on this job"

  flaky:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Randomly-flaky test
          command: |
            mkdir -p /tmp/test-results
            echo  | base64 -d > /tmp/flaky_test.py
            python3 /tmp/flaky_test.py
      - store_test_results:
          path: /tmp/test-results
          when: always

workflows:
  main:
    unless: << pipeline.parameters.run_flaky >>
    jobs:
      - build
      - with-context:
          context: datagen-context
          requires:
            - build
      - legacy-probe

  datagen-flaky:
    when: << pipeline.parameters.run_flaky >>
    jobs:
      - flaky
